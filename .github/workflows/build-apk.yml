
name: Build Gaurav Grocery APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GauravGrocery_Android_Project_Mobile_Build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -o GauravGrocery_Android_Project_Mobile_Build.zip -d srcproject
          ls -la srcproject

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: srcproject
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gaurav-Grocery-APK
          path: srcproject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
