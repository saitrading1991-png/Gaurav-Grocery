<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gaurav Grocery Admin</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6f4;
      color: #1d2922;
    }
    header {
      background: #176b3a;
      color: white;
      padding: 20px;
    }
    header h1 { margin: 0 0 6px; }
    main { max-width: 1100px; margin: auto; padding: 16px; }
    .card {
      background: white;
      padding: 18px;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 9px #0000000d;
    }
    h2 { margin-top: 0; }
    input, select, textarea, button {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #ccd5ce;
      border-radius: 7px;
      font-size: 15px;
    }
    button {
      background: #176b3a;
      color: white;
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }
    button.secondary { background: #53645a; }
    button.danger { background: #b3261e; }
    button:disabled { opacity: .5; cursor: wait; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .hidden { display: none !important; }
    .message { padding: 10px; overflow-wrap: anywhere; }
    .error { color: #b3261e; }
    .success { color: #176b3a; }
    .item {
      border: 1px solid #e0e5e1;
      border-radius: 9px;
      padding: 13px;
      margin: 10px 0;
      overflow-wrap: anywhere;
    }
    .item button { width: auto; margin-right: 5px; }
    .muted { color: #65736a; font-size: 13px; }
    label { display: block; margin-top: 8px; font-size: 14px; }
  </style>
</head>
<body>
<header>
  <h1>🛒 Gaurav Grocery</h1>
  <div>Admin Dashboard</div>
</header>

<main>
  <div id="loginCard" class="card">
    <h2>Admin Login</h2>
    <p class="muted">केवल अधिकृत Admin लॉगिन करें।</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button id="loginButton" type="submit">Login</button>
    </form>
    <div id="loginMessage" class="message">Login system starting…</div>
  </div>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div id="welcome"></div>
      <button id="logoutButton" class="secondary">Logout</button>
      <div id="appMessage" class="message"></div>
    </div>

    <div class="card">
      <h2 id="productFormTitle">Add Product</h2>
      <form id="productForm">
        <input id="productId" type="hidden">

        <div class="grid">
          <div>
            <label>Product Name</label>
            <input id="productName" required placeholder="e.g. Aashirvaad Atta">
          </div>
          <div>
            <label>Category</label>
            <input id="productCategory" required placeholder="e.g. Flour">
          </div>
          <div>
            <label>Price (₹)</label>
            <input id="productPrice" type="number" min="0" step="0.01" required>
          </div>
          <div>
            <label>Unit</label>
            <input id="productUnit" required placeholder="e.g. 5 kg, 1 litre">
          </div>
          <div>
            <label>Stock Quantity (units)</label>
            <input id="stockQuantity" type="number" min="0" step="1" value="0" required>
          </div>
          <div>
            <label>Emoji</label>
            <input id="productEmoji" value="🛒" placeholder="🥫">
          </div>
        </div>

        <label>Image URL (optional)</label>
        <input id="productImage" type="url" placeholder="https://example.com/image.jpg">

        <label>Description (optional)</label>
        <textarea id="productDescription" rows="2"></textarea>

        <label>
          <input id="productActive" type="checkbox" checked style="width:auto">
          Show product in app
        </label>

        <button id="saveProductButton" type="submit">Save Product</button>
        <button id="cancelEditButton" type="button" class="secondary hidden">Cancel Edit</button>
      </form>
    </div>

    <div class="card">
      <h2>Products</h2>
      <button id="refreshProducts" class="secondary">Refresh Products</button>
      <div id="productsList">Loading products…</div>
    </div>

    <div class="card">
      <h2>Customer Orders</h2>
      <button id="refreshOrders" class="secondary">Refresh Orders</button>
      <div id="ordersList">Loading orders…</div>
    </div>
  </section>
</main>

<script>
  window.addEventListener("error", function (e) {
    const el = document.getElementById("loginMessage");
    if (el) {
      el.textContent = "JavaScript error: " + e.message;
      el.className = "message error";
    }
  });

  window.addEventListener("unhandledrejection", function (e) {
    const el = document.getElementById("loginMessage");
    if (el) {
      el.textContent = "Loading error: " +
        (e.reason?.message || String(e.reason));
      el.className = "message error";
    }
  });
</script>

<script type="module">
  const $ = id => document.getElementById(id);

  const loginCard = $("loginCard");
  const dashboard = $("dashboard");
  const loginMessage = $("loginMessage");
  const appMessage = $("appMessage");

  loginMessage.textContent = "Firebase scripts loading…";

  let auth;
  let db;
  let currentUser = null;
  let productsCache = [];
  let ordersCache = [];
  let busy = false;

  const ADMIN_EMAIL = "sai.trading1991@gmail.com";

  const firebaseConfig = {
    apiKey: "AIzaSyBNDAZ89Q_ms4tsAGI3r5m_4ftqucQJHvc",
    authDomain: "gaurav-grocery.firebaseapp.com",
    projectId: "gaurav-grocery",
    storageBucket: "gaurav-grocery.firebasestorage.app",
    messagingSenderId: "517960988134",
    appId: "1:517960988134:web:9dd8e2455cfbec257bd227",
    measurementId: "G-8KNHQNEJ67"
  };

  const allowedStatuses = [
    "Pending",
    "Confirmed",
    "Preparing",
    "Out for Delivery",
    "Delivered",
    "Cancelled"
  ];

  function showMessage(message, error = false) {
    appMessage.textContent = message;
    appMessage.className = "message " + (error ? "error" : "success");
  }

  function money(value) {
    return "₹" + Number(value || 0).toFixed(2);
  }

  function safeText(value) {
    return String(value ?? "");
  }

  function makeElement(tag, text, className) {
    const el = document.createElement(tag);
    el.textContent = text;
    if (className) el.className = className;
    return el;
  }

  function makeButton(text, callback, className = "secondary") {
    const button = makeElement("button", text, className);
    button.type = "button";
    button.addEventListener("click", callback);
    return button;
  }

  function addField(parent, labelText, value) {
    const label = makeElement("label", labelText);
    const input = document.createElement("input");
    input.value = safeText(value);
    label.appendChild(input);
    parent.appendChild(label);
    return input;
  }

  function resetProductForm() {
    $("productForm").reset();
    $("productId").value = "";
    $("productEmoji").value = "🛒";
    $("stockQuantity").value = "0";
    $("productActive").checked = true;
    $("productFormTitle").textContent = "Add Product";
    $("saveProductButton").textContent = "Save Product";
    $("cancelEditButton").classList.add("hidden");
  }

  async function startFirebase() {
    try {
      const appModule = await import(
        "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"
      );
      const authModule = await import(
        "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"
      );
      const storeModule = await import(
        "https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"
      );

      const app = appModule.initializeApp(firebaseConfig);
      auth = authModule.getAuth(app);
      db = storeModule.getFirestore(app);

      const {
        signInWithEmailAndPassword,
        onAuthStateChanged,
        signOut
      } = authModule;

      const {
        collection, getDocs, addDoc, updateDoc, deleteDoc,
        doc, query, orderBy, runTransaction, serverTimestamp
      } = storeModule;

      loginMessage.textContent = "Firebase loaded. Login करें।";
      loginMessage.className = "message success";

      $("loginForm").addEventListener("submit", async event => {
        event.preventDefault();
        $("loginButton").disabled = true;
        loginMessage.textContent = "Logging in…";

        try {
          const result = await signInWithEmailAndPassword(
            auth,
            $("email").value.trim(),
            $("password").value
          );

          if (result.user.email?.toLowerCase() !== ADMIN_EMAIL) {
            await signOut(auth);
            throw new Error("यह email अधिकृत Admin email नहीं है।");
          }
        } catch (error) {
          loginMessage.textContent = error.message;
          loginMessage.className = "message error";
        } finally {
          $("loginButton").disabled = false;
        }
      });

      $("logoutButton").addEventListener("click", () => signOut(auth));

      onAuthStateChanged(auth, async user => {
        if (!user || user.email?.toLowerCase() !== ADMIN_EMAIL) {
          currentUser = null;
          dashboard.classList.add("hidden");
          loginCard.classList.remove("hidden");
          if (user) await signOut(auth);
          return;
        }

        currentUser = user;
        loginCard.classList.add("hidden");
        dashboard.classList.remove("hidden");
        $("welcome").textContent = "Logged in: " + user.email;
        await Promise.all([loadProducts(), loadOrders()]);
      });

      async function loadProducts() {
        $("productsList").textContent = "Loading products…";

        try {
          const snap = await getDocs(collection(db, "products"));
          productsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderProducts();
        } catch (error) {
          $("productsList").textContent = "Products error: " + error.message;
        }
      }

      function renderProducts() {
        const root = $("productsList");
        root.replaceChildren();

        if (!productsCache.length) {
          root.textContent = "No products yet. Add your first product above.";
          return;
        }

        productsCache.forEach(product => {
          const card = makeElement("div", "", "item");
          card.appendChild(makeElement(
            "h3",
            (product.emoji || "🛒") + " " + (product.name || "Unnamed product")
          ));
          card.appendChild(makeElement(
            "p",
            "Category: " + safeText(product.category) +
            " | Price: " + money(product.price) +
            " | Unit: " + safeText(product.unit)
          ));
          card.appendChild(makeElement(
            "p",
            "Stock: " + safeText(product.stockQuantity ?? "Not set") +
            " | Visible: " + (product.active === false ? "No" : "Yes") +
            " | In stock: " + (product.inStock === false ? "No" : "Yes"),
            "muted"
          ));

          card.appendChild(makeButton("Edit", () => editProduct(product)));
          card.appendChild(makeButton(
            product.active === false ? "Show in App" : "Hide from App",
            () => toggleActive(product),
            "secondary"
          ));
          card.appendChild(makeButton(
            "Delete",
            () => removeProduct(product),
            "danger"
          ));
          root.appendChild(card);
        });
      }

      function editProduct(p) {
        $("productId").value = p.id;
        $("productName").value = p.name || "";
        $("productCategory").value = p.category || "";
        $("productPrice").value = p.price ?? 0;
        $("productUnit").value = p.unit || "";
        $("stockQuantity").value = p.stockQuantity ?? 0;
        $("productEmoji").value = p.emoji || "🛒";
        $("productImage").value = p.imageUrl || "";
        $("productDescription").value = p.description || "";
        $("productActive").checked = p.active !== false;
        $("productFormTitle").textContent = "Edit Product";
        $("saveProductButton").textContent = "Update Product";
        $("cancelEditButton").classList.remove("hidden");
        $("productFormTitle").scrollIntoView({ behavior: "smooth" });
      }

      $("cancelEditButton").addEventListener("click", resetProductForm);
      $("refreshProducts").addEventListener("click", loadProducts);
      $("refreshOrders").addEventListener("click", loadOrders);

      $("productForm").addEventListener("submit", async event => {
        event.preventDefault();
        if (busy) return;
        busy = true;
        $("saveProductButton").disabled = true;

        try {
          const name = $("productName").value.trim();
          const category = $("productCategory").value.trim();
          const unit = $("productUnit").value.trim();
          const price = Number($("productPrice").value);
          const stockQuantity = Number($("stockQuantity").value);

          if (!name || !category || !unit) {
            throw new Error("Name, category और unit भरें।");
          }
          if (!Number.isFinite(price) || price < 0) {
            throw new Error("Price सही भरें।");
          }
          if (!Number.isSafeInteger(stockQuantity) || stockQuantity < 0) {
            throw new Error("Stock quantity शून्य या उससे बड़ी पूर्ण संख्या होनी चाहिए।");
          }

          const data = {
            name,
            category,
            unit,
            price,
            stockQuantity,
            emoji: $("productEmoji").value.trim() || "🛒",
            imageUrl: $("productImage").value.trim(),
            description: $("productDescription").value.trim(),
            active: $("productActive").checked,
            inStock: stockQuantity > 0,
            updatedAt: serverTimestamp()
          };

          const id = $("productId").value;
          if (id) {
            await updateDoc(doc(db, "products", id), data);
          } else {
            await addDoc(collection(db, "products"), {
              ...data,
              createdAt: serverTimestamp()
            });
          }

          resetProductForm();
          showMessage("Product successfully saved.");
          await loadProducts();
        } catch (error) {
          showMessage("Product save failed: " + error.message, true);
        } finally {
          busy = false;
          $("saveProductButton").disabled = false;
        }
      });

      async function toggleActive(product) {
        if (busy) return;
        try {
          await updateDoc(doc(db, "products", product.id), {
            active: product.active === false,
            updatedAt: serverTimestamp()
          });
          await loadProducts();
          showMessage("Product visibility updated.");
        } catch (error) {
          showMessage(error.message, true);
        }
      }

      async function removeProduct(product) {
        if (!confirm("Delete " + product.name + "?")) return;
        try {
          await deleteDoc(doc(db, "products", product.id));
          await loadProducts();
          showMessage("Product deleted.");
        } catch (error) {
          showMessage("Delete failed: " + error.message, true);
        }
      }

      async function loadOrders() {
        $("ordersList").textContent = "Loading orders…";

        try {
          const snap = await getDocs(
            query(collection(db, "orders"), orderBy("createdAt", "desc"))
          );
          ordersCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          renderOrders();
        } catch (error) {
          $("ordersList").textContent = "Orders error: " + error.message;
        }
      }

      function renderOrders() {
        const root = $("ordersList");
        root.replaceChildren();

        if (!ordersCache.length) {
          root.textContent = "No orders found.";
          return;
        }

        ordersCache.forEach(order => {
          const card = makeElement("div", "", "item");
          card.appendChild(makeElement("h3", "Order #" + order.id));
          card.appendChild(makeElement(
            "p",
            "Customer: " + safeText(order.customerName) +
            " | Phone: " + safeText(order.phone)
          ));
          card.appendChild(makeElement("p", "Address: " + safeText(order.address)));
          card.appendChild(makeElement(
            "p",
            "Total: " + money(order.totalPrice) +
            " | Current status: " + safeText(order.status)
          ));

          const items = Array.isArray(order.items) ? order.items : [];
          const itemList = makeElement("ul", "");
          items.forEach(item => {
            itemList.appendChild(makeElement(
              "li",
              safeText(item.name) + " × " + safeText(item.quantity) +
              " — " + money(item.unitPrice)
            ));
          });
          card.appendChild(itemList);

          const select = document.createElement("select");
          allowedStatuses.forEach(status => {
            const option = document.createElement("option");
            option.value = status;
            option.textContent = status;
            option.selected = status === order.status;
            select.appendChild(option);
          });
          card.appendChild(select);

          const saveButton = makeButton("Save Status", async () => {
            await changeOrderStatus(order, select.value, saveButton);
          });
          card.appendChild(saveButton);

          if (order.status === "Pending") {
            card.appendChild(makeElement(
              "p",
              "Confirming this order will deduct stock. Verify customer and item details first.",
              "muted"
            ));
          }

          root.appendChild(card);
        });
      }

      async function changeOrderStatus(order, newStatus, button) {
        if (busy) return;
        if (!allowedStatuses.includes(newStatus)) {
          showMessage("Invalid status.", true);
          return;
        }
        if (newStatus === order.status) return;

        // Only Pending -> Confirmed deducts stock.
        // Do not allow skipping the stock check.
        if (order.status === "Pending" &&
            !["Confirmed", "Cancelled"].includes(newStatus)) {
          showMessage(
            "Pending order को पहले Confirm या Cancel करें। Stock check bypass नहीं हो सकता।",
            true
          );
          return;
        }

        if (order.status !== "Pending" && newStatus === "Pending") {
          showMessage("Order को वापस Pending नहीं किया जा सकता।", true);
          return;
        }

        if (order.status === "Pending" && newStatus === "Confirmed") {
          if (!confirm("Confirm order and deduct stock for every item?")) return;
        }

        busy = true;
        button.disabled = true;

        try {
          if (order.status === "Pending" && newStatus === "Confirmed") {
            await runTransaction(db, async transaction => {
              const orderRef = doc(db, "orders", order.id);
              const orderSnap = await transaction.get(orderRef);

              if (!orderSnap.exists()) throw new Error("Order not found.");
              const freshOrder = orderSnap.data();

              if (freshOrder.status !== "Pending") {
                throw new Error("Order status changed. Refresh and retry.");
              }

              if (!Array.isArray(freshOrder.items) ||
                  freshOrder.items.length === 0) {
                throw new Error("Order has no items.");
              }

              const quantities = new Map();

              for (const item of freshOrder.items) {
                const id = item.productId;
                const qty = Number(item.quantity);

                if
