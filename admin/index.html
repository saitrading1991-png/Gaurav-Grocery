<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaurav Grocery Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#1d2922;font-family:Arial,sans-serif}header{background:#176b3a;color:#fff;padding:18px}main{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #0000000d}h1,h2{margin-top:0}input,select,textarea,button{width:100%;padding:11px;margin:6px 0;border:1px solid #ccd5ce;border-radius:7px;font-size:15px}button{background:#176b3a;color:#fff;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#53645a}.danger{background:#b3261e}.hidden{display:none!important}.message{padding:8px;overflow-wrap:anywhere}.error{color:#b3261e}.success{color:#176b3a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.item{border:1px solid #dfe5e0;border-radius:9px;padding:12px;margin:10px 0;overflow-wrap:anywhere}.item button{width:auto;margin-right:5px}.muted{color:#65736a;font-size:13px}label{display:block;margin-top:8px}
</style></head><body>
<header><h1>🛒 Gaurav Grocery</h1>Admin Dashboard</header><main>
<section id="loginCard" class="card"><h2>Admin Login</h2><form id="loginForm"><input id="email" type="email" placeholder="Admin email" required><input id="password" type="password" placeholder="Password" required><button id="loginButton" type="submit">Login</button></form><div id="loginMessage" class="message">Page loaded. Starting login system…</div></section>
<section id="dashboard" class="hidden"><div class="card"><div id="welcome"></div><button id="logoutButton" class="secondary">Logout</button><div id="appMessage" class="message"></div></div>
<div class="card"><h2 id="formTitle">Add Product</h2><form id="productForm"><input id="productId" type="hidden"><div class="grid"><div><label>Product name</label><input id="name" required></div><div><label>Category</label><input id="category" required></div><div><label>Price (₹)</label><input id="price" type="number" min="0" step="0.01" required></div><div><label>Unit (e.g. 1 kg)</label><input id="unit" required></div><div><label>Stock quantity</label><input id="stockQuantity" type="number" min="0" step="1" value="0" required></div><div><label>Emoji</label><input id="emoji" value="🛒"></div></div><label>Image URL (optional)</label><input id="imageUrl" type="url" placeholder="https://..."><label>Description</label><textarea id="description" rows="2"></textarea><label><input id="active" type="checkbox" checked style="width:auto"> Show product in app</label><button id="saveProduct" type="submit">Save Product</button><button id="cancelEdit" type="button" class="secondary hidden">Cancel edit</button></form></div>
<div class="card"><h2>Products</h2><button id="refreshProducts" class="secondary">Refresh products</button><div id="productsList">Loading products…</div></div><div class="card"><h2>Orders</h2><button id="refreshOrders" class="secondary">Refresh orders</button><div id="ordersList">Loading orders…</div></div></section></main>
<script>
window.addEventListener("error",e=>{const x=document.getElementById("loginMessage");if(x){x.textContent="JavaScript error: "+e.message;x.className="message error";}});
window.addEventListener("unhandledrejection",e=>{const x=document.getElementById("loginMessage");if(x){x.textContent="Startup error: "+(e.reason?.message||String(e.reason));x.className="message error";}});
</script>
<script type="module">
const $=id=>document.getElementById(id),loginMessage=$("loginMessage");loginMessage.textContent="Module started. Loading Firebase…";
const ADMIN_EMAIL="sai.trading1991@gmail.com";
const firebaseConfig={apiKey:"AIzaSyBNDAZ89Q_ms4tsAGI3r5m_4ftqucQJHvc",authDomain:"gaurav-grocery.firebaseapp.com",projectId:"gaurav-grocery",storageBucket:"gaurav-grocery.firebasestorage.app",messagingSenderId:"517960988134",appId:"1:517960988134:web:9dd8e2455cfbec257bd227",measurementId:"G-8KNHQNEJ67"};
const statuses=["Pending","Confirmed","Preparing","Out for Delivery","Delivered","Cancelled"];let auth,db,busy=false,products=[],orders=[];
const say=(m,error=false)=>{$("appMessage").textContent=m;$("appMessage").className="message "+(error?"error":"success");},money=n=>"₹"+Number(n||0).toFixed(2),el=(tag,text,cls)=>{const x=document.createElement(tag);x.textContent=text;if(cls)x.className=cls;return x;},btn=(text,fn,cls="secondary")=>{const b=el("button",text,cls);b.type="button";b.addEventListener("click",fn);return b;};
function resetForm(){$("productForm").reset();$("productId").value="";$("emoji").value="🛒";$("stockQuantity").value="0";$("active").checked=true;$("formTitle").textContent="Add Product";$("saveProduct").textContent="Save Product";$("cancelEdit").classList.add("hidden");}
async function boot(){try{
const appM=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),authM=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),fs=await import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js");
const app=appM.initializeApp(firebaseConfig);auth=authM.getAuth(app);db=fs.getFirestore(app);
const {signInWithEmailAndPassword,onAuthStateChanged,signOut}=authM;const {collection,getDocs,addDoc,updateDoc,deleteDoc,doc,query,orderBy,runTransaction,serverTimestamp}=fs;
loginMessage.textContent="Firebase loaded. Please login.";loginMessage.className="message success";
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;loginMessage.textContent="Logging in…";try{const r=await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);if((r.user.email||"").toLowerCase()!==ADMIN_EMAIL){await signOut(auth);throw Error("This email is not authorized as admin.");}}catch(err){loginMessage.textContent=err.message;loginMessage.className="message error";}finally{$("loginButton").disabled=false;}});
$("logoutButton").addEventListener("click",()=>signOut(auth));$("refreshProducts").addEventListener("click",loadProducts);$("refreshOrders").addEventListener("click",loadOrders);$("cancelEdit").addEventListener("click",resetForm);
onAuthStateChanged(auth,async user=>{if(!user||(user.email||"").toLowerCase()!==ADMIN_EMAIL){$("dashboard").classList.add("hidden");$("loginCard").classList.remove("hidden");if(user)await signOut(auth);return;}$("loginCard").classList.add("hidden");$("dashboard").classList.remove("hidden");$("welcome").textContent="Logged in: "+user.email;await Promise.all([loadProducts(),loadOrders()]);});
async function loadProducts(){$("productsList").textContent="Loading products…";try{const s=await getDocs(collection(db,"products"));products=s.docs.map(d=>({id:d.id,...d.data()}));renderProducts();}catch(e){$("productsList").textContent="Products error: "+e.message;}}
function renderProducts(){const root=$("productsList");root.replaceChildren();if(!products.length){root.textContent="No products found.";return;}products.forEach(p=>{const c=el("div","","item");c.append(el("h3",(p.emoji||"🛒")+" "+(p.name||"Unnamed")));c.append(el("p","Category: "+(p.category||"")+" | Price: "+money(p.price)+" | Unit: "+(p.unit||"")));c.append(el("p","Stock: "+(p.stockQuantity??"Not set")+" | Visible: "+(p.active===false?"No":"Yes"),"muted"));c.append(btn("Edit",()=>editProduct(p)));c.append(btn(p.active===false?"Show in app":"Hide from app",()=>toggleActive(p)));c.append(btn("Delete",()=>removeProduct(p),"danger"));root.append(c);});}
function editProduct(p){$("productId").value=p.id;$("name").value=p.name||"";$("category").value=p.category||"";$("price").value=p.price??0;$("unit").value=p.unit||"";$("stockQuantity").value=p.stockQuantity??0;$("emoji").value=p.emoji||"🛒";$("imageUrl").value=p.imageUrl||"";$("description").value=p.description||"";$("active").checked=p.active!==false;$("formTitle").textContent="Edit Product";$("saveProduct").textContent="Update Product";$("cancelEdit").classList.remove("hidden");$("formTitle").scrollIntoView({behavior:"smooth"});}
$("productForm").addEventListener("submit",async e=>{e.preventDefault();if(busy)return;busy=true;$("saveProduct").disabled=true;try{const stock=Number($("stockQuantity").value),price=Number($("price").value);if(!Number.isSafeInteger(stock)||stock<0)throw Error("Stock must be a whole number of zero or more.");if(!Number.isFinite(price)||price<0)throw Error("Enter a valid price.");const data={name:$("name").value.trim(),category:$("category").value.trim(),price,unit:$("unit").value.trim(),stockQuantity:stock,inStock:stock>0,emoji:$("emoji").value.trim()||"🛒",imageUrl:$("imageUrl").value.trim(),description:$("description").value.trim(),active:$("active").checked,updatedAt:serverTimestamp()};if(!data.name||!data.category||!data.unit)throw Error("Fill name, category and unit.");const id=$("productId").value;if(id)await updateDoc(doc(db,"products",id),data);else await addDoc(collection(db,"products"),{...data,createdAt:serverTimestamp()});resetForm();say("Product saved.");await loadProducts();}catch(err){say("Save failed: "+err.message,true);}finally{busy=false;$("saveProduct").disabled=false;}});
async function toggleActive(p){try{await updateDoc(doc(db,"products",p.id),{active:p.active===false,updatedAt:serverTimestamp()});await loadProducts();say("Product visibility updated.");}catch(e){say(e.message,true);}}
async function removeProduct(p){if(!confirm("Delete "+p.name+"?"))return;try{await deleteDoc(doc(db,"products",p.id));await loadProducts();say("Product deleted.");}catch(e){say("Delete failed: "+e.message,true);}}
async function loadOrders(){$("ordersList").textContent="Loading orders…";try{const s=await getDocs(query(collection(db,"orders"),orderBy("createdAt","desc")));orders=s.docs.map(d=>({id:d.id,...d.data()}));renderOrders();}catch(e){$("ordersList").textContent="Orders error: "+e.message;}}
function renderOrders(){const root=$("ordersList");root.replaceChildren();if(!orders.length){root.textContent="No orders found.";return;}orders.forEach(o=>{const c=el("div","","item");c.append(el("h3","Order #"+o.id));c.append(el("p","Customer: "+(o.customerName||"")+" | Phone: "+(o.phone||"")));c.append(el("p","Address: "+(o.address||"")));c.append(el("p","Total: "+money(o.totalPrice)+" | Status: "+(o.status||"Pending")));const ul=document.createElement("ul");(Array.isArray(o.items)?o.items:[]).forEach(i=>ul.append(el("li",(i.name||"Item")+" × "+i.quantity+" — "+money(i.unitPrice))));c.append(ul);const sel=document.createElement("select");statuses.forEach(s=>{const op=el("option",s);op.value=s;op.selected=s===(o.status||"Pending");sel.append(op);});c.append(sel);c.append(btn("Save status",()=>changeStatus(o,sel.value),"secondary"));if((o.status||"Pending")==="Pending")c.append(el("p","Confirming deducts stock. Verify order details first.","muted"));root.append(c);});}
async function changeStatus(o,next){if(busy||next===(o.status||"Pending"))return;const current=o.status||"Pending";if(current==="Pending"&&!["Confirmed","Cancelled"].includes(next)){say("First confirm or cancel this pending order.",true);return;}if(current!=="Pending"&&next==="Pending"){say("Cannot return an order to Pending.",true);return;}if(current==="Pending"&&next==="Confirmed"&&!confirm("Confirm order and deduct stock?"))return;busy=true;try{if(current==="Pending"&&next==="Confirmed"){await runTransaction(db,async tx=>{const orderRef=doc(db,"orders",o.id),os=await tx.get(orderRef);if(!os.exists()||os.data().status!=="Pending")throw Error("Order changed. Refresh and retry.");const items=os.data().items;if(!Array.isArray(items)||!items.length)throw Error("Order has no items.");const qty=new Map();for(const i of items){const n=Number(i.quantity);if(!i.productId||!Number.isSafeInteger(n)||n<=0)throw Error("Invalid item or quantity.");qty.set(i.productId,(qty.get(i.productId)||0)+n);}const ids=[...qty.keys()],refs=ids.map(id=>doc(db,"products",id)),snaps=[];for(const ref of refs)snaps.push(await tx.get(ref));const updates=snaps.map((s,i)=>{if(!s.exists())throw Error("A product no longer exists.");const p=s.data(),available=p.stockQuantity,needed=qty.get(ids[i]);if(p.active===false)throw Error("Product is hidden: "+(p.name||ids[i]));if(!Number.isSafeInteger(available)||available<needed)throw Error("Insufficient/unset stock for "+(p.name||ids[i])+". Available: "+available);return {ref:refs[i],remaining:available-needed};});updates.forEach(u=>tx.update(u.ref,{stockQuantity:u.remaining,inStock:u.remaining>0}));/* Only status is changed on order to match Firestore Rules. */tx.update(orderRef,{status:"Confirmed"});});}else{await updateDoc(doc(db,"orders",o.id),{status:next});}say("Order status updated: "+next);await Promise.all([loadOrders(),loadProducts()]);}catch(e){say("Order update failed: "+e.message,true);}finally{busy=false;}}
}catch(err){loginMessage.textContent="Firebase startup failed: "+(err.message||String(err));loginMessage.className="message error";console.error(err);}}
boot();
</script></body></html>
